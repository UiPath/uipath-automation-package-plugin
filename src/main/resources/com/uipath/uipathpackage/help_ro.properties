ExternalAppAuthenticationEntry.accountForApp=Specifică numele contului Cloud Orchestrator.
ExternalAppAuthenticationEntry.applicationId=Specifică ID-ul extern confidențial al aplicației. Află mai multe despre cum să adaugi o aplicație externă urmând pașii descriși https://docs.uipath.com/automation-cloud/docs/managing-external-applications
ExternalAppAuthenticationEntry.applicationSecret=Specifică secretul confidențial al aplicației externe.
ExternalAppAuthenticationEntry.applicationScope=Specificați domeniul (sfera de aplicare confidențială) externă. Este obligatoriu să se folosească doar Domeniul de Aplicare (Sfera Aplicației).
TokenAuthenticationEntry.accountName=Specifică numele contului Cloud Orchestrator.
TokenAuthenticationEntry.credentialsId=Specifică tokenul refresh folosind care trebuie autentificat la instanța Cloud Orchestrator. Află mai multe despre cum să generezi acest token urmând pașii descriși https://docs.uipath.com/orchestrator/v2019/reference#consuming-cloud-api
DynamicallyEntry.jobCount=Numărul de joburi înființate. (implicit 1)
DynamicallyEntry.machine=Numele mașinii. Această funcție este disponibilă doar pe folderele moderne.
DynamicallyEntry.user=Numele utilizatorului. Această funcție este disponibilă doar pe folderele moderne. Ar trebui să fie un utilizator de mașină, nu un utilizator Orchestrator . Pentru utilizatorii locali, formatul ar trebui să fie NumeMașini\\NumeUtilizator".
RobotEntry.robotIds=Lista cu nume specifice roboților, separată de virgule.
TestProjectEntry.environments=Specifică mediul în care pachetul va fi implementat ca proces. Pentru proiect și mediul cu procesele existente, procesele vor fi actualizate pentru a folosi cea mai recentă versiune a proiectului. Este obligatoriu când folosești un folder clasic, altfel nu este aplicabil.
TestProjectEntry.testProjectPath=Specifică locația unui proiect de test care urmează să fie implementat în Orchestrator și executat ca parte a unui set de teste tranzitori.
TestSetEntry.testSet=Specificați cheia unui set de testare preexistent în Test Manager sau numele setului de testare din Modulul de Testare Orchestrator. Dacă setul de testare nu aparține folderului implicit (unitatea de organizare), acesta trebuie să fie precedat de numele folderului, de exemplu AccountingTeam\\TestSet
UiPathAssets.environments=Specifică mediul în care activele vor fi implementate sau actualizate.
UiPathAssets.filePath=Specifică calea pentru fișierele csv folosite pentru a descrie resursele care vor fi implementate sau actualizate. Vă rugăm să folosiți următorul format de fișier: <pre> Nume, tip, valoare</pre> <pre> asset_1_name, text, asset_value   # putem avea comentarii</pre> <pre> asset_2_name, întreg, 123</pre> <pre> asset_3_name, boolean, fals </pre> <pre> asset_4_name,credențial,"username::p assword"</pre> Pentru actualizare, coloana de tip nu este folosită, deci poate fi goală, dar încă prezentă.
UiPathAssets.folderName=Specifică folderul unde activele vor fi implementate sau actualizate.
UiPathAssets.orchestratorAddress=Specifică adresa instanței Orchestrator pe care activele vor fi implementate sau actualizate.
UiPathAssets.orchestratorTenant=Specifică tenantul Orchestrator pe care vor fi implementate sau actualizate activele.
UiPathAssets.traceLevel=Nivelul de înregistrare a traseelor. Una dintre următoarele valori: Niciunul, Critic, Eroare, Avertisment, Informații, Verbos. (implicit Niciunul)
UiPathDeploy.environments=Specifică mediul în care pachetul va fi implementat ca proces. Pentru proiect și mediul cu procesele existente, procesele vor fi actualizate pentru a folosi cea mai recentă versiune a proiectului. Este obligatoriu când folosești un folder clasic, altfel nu este aplicabil.
UiPathDeploy.entryPointPaths=Definește punctele de intrare specifice pentru crearea sau actualizarea unui proces. Acesta este filePath al punctului de intrare pornind de la rădăcina proiectului. <pre> de exemplu, "Folder1/Main.xaml, Folder1/Folder2/AdditionalEntrypoint.xaml" (fără ghilimele) </pre> Pentru folderele clasice poate fi specificat doar un singur punct de intrare; pentru fiecare mediu va fi creat sau actualizat un proces cu punctul de intrare specificat. Funcționează doar pentru Orchestrator ≥ 21.4.
UiPathDeploy.folderName=Specifică folderul în care să faci deploy. Dacă folderul este un folder clasic, va trebui să setezi și câmpul de medii. Pentru folderele moderne, setarea mediilor nu este obligatorie.
UiPathDeploy.orchestratorAddress=Specificați adresa instanței Orchestrator pe care pachetul/pachetele vor fi implementate.
UiPathDeploy.orchestratorTenant=Specifică tenantul Orchestrator pe care va fi implementat pachetul/pachetele.
UiPathDeploy.packagePath=Specifică locația pachetului/pachetelor care urmează să fie implementate în Orchestrator. Căile sunt locale pentru spațiul de lucru al construcției.
UiPathDeploy.traceLevel=Nivelul de înregistrare a traseelor. Una dintre următoarele valori: Niciunul, Critic, Eroare, Avertisment, Informații, Verbos. (implicit Niciunul)
UiPathDeploy.createProcess=Când este selectat, un proces va fi creat în folderul specificat corespunzător căii/căii de intrare a punctului de intrare. (implicit adevărat)
UiPathPack.orchestratorAddress=Specifică adresa instanței Orchestrator de la care ar trebui restaurate dependențele bibliotecii.
UiPathPack.orchestratorTenant=Specificați tenantul instanței Orchestrator de la care trebuie restaurate dependențele bibliotecii.
UiPathPack.outputPath=Specifică locația unde vrei să ieși pachetul/pachetele NuGet. Căile sunt locale pentru spațiul de lucru al construcției.
UiPathPack.outputType=Forțează ieșirea la un anumit tip.
UiPathPack.runWorkflowAnalysis=Rulează analiza fluxului de lucru înainte de a împacheta și eșuează în caz de erori. (implicit fals)
UiPathPack.projectJsonPath=Locația proiectului/proiectelor ce urmează a fi ambalate. Poate fi o cale directă către un fișier project.json sau un director cu unul sau mai multe proiecte. În cel de-al doilea caz, fiecare proiect de nivel unu este ambalat individual
UiPathPack.versionEntry=Metoda de generare automată a versiunilor folosește același algoritm ca UiPath Studio.<br>Ambalarea simultană a mai multor proiecte folosind versiune personalizată aplică aceeași versiune tuturor.
UiPathPack.traceLevel=Nivelul de înregistrare a traseelor. Una dintre următoarele valori: Niciunul, Critic, Eroare, Avertisment, Informații, Verbos. (implicit Niciunul)
UiPathRunJob.failWhenJobFails=Comanda eșuează când cel puțin o sarcină eșuează. (implicit adevărat)
UiPathRunJob.folderName=Specifică folderul în care să rulezi. Dacă folderul este un folder modern, poți ținti și un utilizator și/sau o anumită mașină.
UiPathRunJob.jobsCount=Numărul de joburi înființate. (implicit 1)
UiPathRunJob.orchestratorAddress=Specifică adresa instanței Orchestrator pe care vor fi rulate joburile.
UiPathRunJob.orchestratorTenant=Specificați chiriașul Orchestrator pe care vor fi rulate joburile.
UiPathRunJob.parametersFilePath=Calea completă către un fișier de intrare json.
UiPathRunJob.processName=Numele procesului.
UiPathRunJob.resultFilePath=Calea completă către un fișier json sau un folder unde va fi creat fișierul json rezultat.
UiPathRunJob.startProcessDtoJobPriority=Prioritatea joburilor (joburile) este. Una dintre următoarele valori: Scăzut, Normal, Ridicat. (Normal implicit)
UiPathRunJob.timeout=Timeout-ul pentru jobul (joburile) durează în câteva secunde. (implicit 1800)
UiPathRunJob.waitForJobCompletion=Așteaptă să se termine rundările de lucru. (implicit adevărat)
UiPathRunJob.jobTypeEntry=Această funcție este disponibilă doar pe folderele moderne! Alege modelul de licență al runtime-ului sub care urmează să fie executată lucrarea.
UiPathRunJob.traceLevel=Nivelul de înregistrare a traseelor. Una dintre următoarele valori: Niciunul, Critic, Eroare, Avertisment, Informații, Verbos. (implicit Niciunul)
UiPathTest.folderName=Specifică folderul în care să faci deploy. Dacă folderul este un folder clasic și vrei să execuți un set de teste pentru tranzitori, va trebui să setezi și mediul. Pentru folderele moderne, mediul nu este necesar.
UiPathTest.orchestratorAddress=Specificați adresa instanței Orchestrator pe care pachetul/pachetele vor fi implementate.
UiPathTest.orchestratorTenant=Specifică tenantul Orchestrator pe care va fi implementat pachetul/pachetele.
UiPathTest.testResultsOutputPath=Specifică calea de ieșire a rezultatelor testului, de exemplu Ieșirea estResults.xml. Rezultatele sunt produse în format JUnit. Dacă nu este specificat, rezultatele sunt trimise în spațiul de lucru ca UiPathResults.xml.
UiPathTest.testTarget=Specifică ținta de execuție a testului, un set de testare preexistent pe Orchestrator sau testele dintr-un pachet pe o anumită cale, care vor fi executate ca parte a unui set de testare tranzitorie.
UiPathTest.timeout=Specifică timeout-ul unui proiect de test care urmează să fie implementat în Orchestrator și executat ca parte a unui set de testare tranzitorie. Valoarea implicită este 7200 de secunde.
UiPathTest.traceLevel=Nivelul de înregistrare a traseelor. Una dintre următoarele valori: Niciunul, Critic, Eroare, Avertisment, Informații, Verbos. (implicit Niciunul)
UiPathTest.parametersFilePath=Specifică locația unui fișier json cu parametri de intrare pentru a suprascrie argumentele de intrare pentru un set de test tranzitoriu.
UiPathSolutionDeletePackage.packageName=Numele pachetului de soluție de șters. Trebuie să corespundă unui pachet existent în Orchestratorțintă .
UiPathSolutionDeletePackage.packageVersion=Versiunea pachetului de soluții de șters. Trebuie să corespundă numelui pachetului selectat.
UiPathSolutionDeletePackage.orchestratorAddress=Specifică adresa instanței Orchestrator de unde va fi ștearsă configurația soluției.
UiPathSolutionDeletePackage.orchestratorTenant=Specifică chiriașul instanței Orchestrator de unde va fi ștearsă configurația soluției.
UiPathSolutionDeploy.orchestratorAddress=Specificați adresa instanței Orchestrator pe care va fi implementat pachetul de soluție.
UiPathSolutionDeploy.orchestratorTenant=Specificați chiriașul instanței Orchestrator pe care va fi implementat pachetul de soluție.
UiPathSolutionActivateDeployment.orchestratorAddress=Specifică adresa instanței Orchestrator de unde va fi activată implementarea.
UiPathSolutionActivateDeployment.orchestratorTenant=Specifică chiriașul instanței Orchestrator de unde va fi activată implementarea.
UiPathSolutionUninstallDeployment.orchestratorAddress=Specifică adresa Orchestrator de unde va fi dezinstalată implementarea.
UiPathSolutionUninstallDeployment.orchestratorTenant=Specifică tenantul instanței Orchestrator de unde va fi desinstalată implementarea.
UiPathSolutionDownloadConfig.orchestratorAddress=Specifică adresa instanței Orchestrator de unde va fi descărcată configurația soluției.
UiPathSolutionDownloadConfig.orchestratorTenant=Specificați chiriașul instanței Orchestrator de unde va fi descărcată configurația soluției.
UiPathSolutionDownloadPackage.orchestratorAddress=Specifică adresa instanței Orchestrator de unde va fi descărcat pachetul de soluție.
UiPathSolutionDownloadPackage.orchestratorTenant=Specifică chiriașul instanței Orchestrator de unde va fi descărcat pachetul de soluție.
UiPathSolutionUploadPackage.orchestratorAddress=Specifică adresa instanței Orchestrator pe care va fi încărcat pachetul de soluție.
UiPathSolutionUploadPackage.orchestratorTenant=Specificați chiriașul instanței Orchestrator pe care va fi implementat pachetul de soluție.
UiPathSolutionPack.orchestratorAddress=Specifică adresa instanței Orchestrator de la care ar trebui restaurate dependențele bibliotecii.
UiPathSolutionPack.orchestratorTenant=Specificați tenantul instanței Orchestrator de la care trebuie restaurate dependențele bibliotecii.
UiPathSolutionPack.outputPath=Specifică locația unde vrei să ieși pachetul/pachetele NuGet. Căile sunt locale pentru spațiul de lucru al construcției.
UiPathSolutionPack.runWorkflowAnalysis=Rulează analiza fluxului de lucru înainte de a împacheta și eșuează în caz de erori. (implicit fals)
UiPathSolutionPack.workspacePath=Locația proiectului/proiectelor ce urmează a fi ambalate. Poate fi o cale directă către un fișier project.json sau un director cu unul sau mai multe proiecte. În cel de-al doilea caz, fiecare proiect de nivel unu este ambalat individual
UiPathSolutionPack.traceLevel=Nivelul de înregistrare a traseelor. Una dintre următoarele valori: Niciunul, Critic, Eroare, Avertisment, Informații, Verbos. (implicit Niciunul)
